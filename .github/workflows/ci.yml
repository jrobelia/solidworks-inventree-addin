name: CI

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format verify
        run: dotnet format "Solidworks Inventree Add-In.sln" --verify-no-changes

      - name: Test
        run: dotnet test --configuration Release --verbosity normal --disable-build-servers

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = & .\Installer\Resolve-ISCC.ps1
          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup -e --version 6.7.3 --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          .\Installer\Package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Item "Installer\SwInventreeAddin-*-Setup.exe" -ErrorAction SilentlyContinue)) {
            throw "Setup exe was not produced — is Inno Setup installed on the runner? Set the INNO_SETUP env var to ISCC.exe's path"
          }
