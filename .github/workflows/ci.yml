name: CI

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore (locked)
        run: dotnet restore "Solidworks Inventree Add-In.sln" --locked-mode

      - name: Format verify
        run: dotnet format "Solidworks Inventree Add-In.sln" --verify-no-changes

      - name: Test
        run: dotnet test --configuration Release --verbosity normal --disable-build-servers

      - name: Ensure Inno Setup
        shell: pwsh
        run: .\Installer\Ensure-ISCC.ps1

      - name: Build installer package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          .\Installer\Package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Item "Installer\InvenTree-Link-*-Setup.exe" -ErrorAction SilentlyContinue)) {
            throw "Setup exe was not produced — check the ISCC output above"
          }
