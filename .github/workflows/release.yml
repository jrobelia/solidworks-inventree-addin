name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Package.ps1's `git describe` sees tags —
          # the default shallow clone would name the exe after a commit sha.
          fetch-depth: 0

      - name: Ensure Inno Setup
        shell: pwsh
        run: .\Installer\Ensure-ISCC.ps1

      - name: Build installer package
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          .\Installer\Package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Installer/SwInventreeAddin-*-Setup.exe
          fail_on_unmatched_files: true
